<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Carnet repas</title>
    <meta name="description" content="Mon suivi personnel : repas, recettes et pesées." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131916" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Carnet repas" />
    <script>
      // Thème choisi avec le bouton clair/sombre (sinon, celui du système), appliqué avant l'affichage.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
    />
    <link rel="stylesheet" href="styles.css?v=__VERSION__" />
    <script type="module" src="app.js?v=__VERSION__"></script>
  </head>
  <body>
    <div id="login" hidden>
      <form id="login-form" class="login-card">
        <img src="icons/icon-192.png" alt="" width="64" height="64" />
        <h1>Carnet repas</h1>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Mot de passe</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="primary big" type="submit">Se connecter</button>
        <button id="login-cancel" class="ghost" type="button">Annuler</button>
        <p id="login-error" class="error" role="alert"></p>
        <p class="muted small">Réservé au propriétaire du carnet : la consultation est libre.</p>
      </form>
    </div>

    <div id="shell" hidden>
      <header class="topbar">
        <div class="topbar-start">
          <span class="brand">Carnet repas</span>
          <nav class="tabs" aria-label="Vues">
            <button data-view="jour">Jour</button>
            <button data-view="calendrier">Calendrier</button>
          </nav>
        </div>
        <div class="topbar-end">
          <button id="auth-button" class="ghost small">Se connecter</button>
          <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="false" aria-label="Thème sombre">
            <svg class="theme-icon sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="theme-icon moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
            </svg>
            <span class="theme-knob" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <section id="view-jour" class="view" hidden>
        <div class="day-nav">
          <button id="prev-day" class="icon" aria-label="Jour précédent">‹</button>
          <div class="day-heading">
            <h2 id="day-title"></h2>
            <div class="day-sub">
              <span id="day-subtitle" class="muted small"></span>
              <input type="date" id="day-picker" aria-label="Choisir une date" />
            </div>
          </div>
          <button id="next-day" class="icon" aria-label="Jour suivant">›</button>
        </div>
        <div id="day-body"></div>
      </section>

      <section id="view-calendrier" class="view" hidden>
        <div class="month-nav">
          <button id="prev-month" class="icon" aria-label="Mois précédent">‹</button>
          <h2 id="month-title"></h2>
          <button id="next-month" class="icon" aria-label="Mois suivant">›</button>
          <button id="this-month" class="ghost small">Aujourd'hui</button>
        </div>
        <div class="weekdays" aria-hidden="true">
          <span>Lun</span><span class="tue">Mar · pesée</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
        </div>
        <div id="grid" class="grid"></div>
      </section>

      <footer id="version" class="muted small center"></footer>
    </div>

    <div id="update-banner" role="status" hidden>
      <span>Nouvelle version disponible</span>
      <button id="update-now" class="primary small">Mettre à jour</button>
    </div>

    <div id="lightbox" hidden><img alt="" /></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
