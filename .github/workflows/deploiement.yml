# Déploiement automatique à chaque envoi (push) sur la branche main :
#   1. Supabase : migrations de la base, clé Gemini, fonctions « lire-recette » et « cadrer-balance »
#   2. Site : publication sur GitHub Pages avec un numéro de version, que l'appli
#      du téléphone détecte pour se mettre à jour toute seule.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  supabase:
    name: Base de données et fonction
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Vérifier les secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret manquant : $name (GitHub > Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v7

      - name: Lire l'identifiant du projet (config.js)
        run: |
          ref="$(sed -n 's#.*https://\([a-z0-9]*\)\.supabase\.co.*#\1#p' config.js)"
          if [ -z "$ref" ]; then
            echo "::error::Adresse Supabase introuvable dans config.js"
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Relier le projet Supabase
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Appliquer les migrations de la base
        run: supabase db push

      - name: Fermer les inscriptions (seuls les comptes créés dans Supabase se connectent)
        run: |
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"disable_signup": true}' > /dev/null

      - name: Enregistrer la clé Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: supabase secrets set --project-ref "$PROJECT_REF" GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Déployer les fonctions (lire-recette, cadrer-balance)
        run: supabase functions deploy --project-ref "$PROJECT_REF"

  site:
    name: Site web
    needs: supabase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Préparer le site
        run: |
          version="$(tr -d ' \r\n' < VERSION)"   # numéro affiché, ex. 1.2.0
          build="${GITHUB_SHA::7}"                  # identifiant unique du déploiement
          build_date="$(TZ=Europe/Paris date +%d/%m/%Y)"

          mkdir _site
          cp index.html app.js api.js config.js styles.css manifest.webmanifest _site/
          cp -r icons _site/
          # Identifiant du déploiement dans les liens des fichiers : le téléphone ne peut pas
          # garder un mélange d'ancienne et de nouvelle version en cache.
          sed -i "s/__VERSION__/$build/g; s/__APP_VERSION__/$version/g; s#__BUILD_DATE__#$build_date#g" \
            _site/index.html _site/app.js _site/api.js
          echo "{\"version\":\"$version\",\"build\":\"$build\",\"date\":\"$build_date\"}" > _site/version.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
